<!-- PAGE HEAD -->
<header class="page-head">
  <span class="eyebrow">Motion</span>
  <h1>動態圖像</h1>
  <p>動態設計與動畫作品。每個專案可能包含多支片段，點開後可用下方縮圖切換瀏覽。卡片預設靜止，滑鼠移上去才會播放。</p>
</header>

<!-- GALLERY — each card = a project; cover is a <video> (poster=靜止, hover=播放) -->
<section class="gallery ad-gallery" id="motionGallery">

  <div class="shot" data-hover
       data-title="MOMOKA 動態圖像設計委託"
       data-desc="個人委託接案。">
    <video autoplay muted loop playsinline preload="metadata">
      <source src="./videos/momoka.mp4" type="video/mp4">
    </video>
  </div>

  <div class="shot" data-hover
       data-title="品牌片頭動畫"
       data-desc="品牌識別的動態化片頭，logo 由線條生長成形，搭配音效節奏。包含多種長度版本。"
       data-images="./images/hero-1.jpg,./images/hero-2.jpg,./images/hero-3.jpg">
    <video autoplay muted loop playsinline preload="metadata" poster="./images/hero-1.jpg"></video>
  </div>

  <div class="shot" data-hover
       data-title="社群短影音系列"
       data-desc="一系列垂直短影音的動態模板，統一視覺語言、可快速套用不同內容。"
       data-images="./images/hero-2.jpg,./images/hero-3.jpg">
    <video autoplay muted loop playsinline preload="metadata" poster="./images/hero-2.jpg"></video>
  </div>

  <div class="shot" data-hover
       data-title="資訊圖動畫"
       data-desc="把複雜數據轉成易懂的動態資訊圖，逐段引導觀眾理解。"
       data-images="./images/hero-3.jpg,./images/hero-1.jpg,./images/hero-2.jpg">
    <video autoplay muted loop playsinline preload="metadata" poster="./images/hero-3.jpg"></video>
  </div>

  <div class="shot" data-hover
       data-title="Logo Motion"
       data-desc="單一 logo 動態（此專案只有一支，所以不會出現縮圖列）。"
       data-images="./images/me.jpg">
    <video autoplay muted loop playsinline preload="metadata" poster="./images/me.jpg"></video>
  </div>

  <div class="shot" data-hover
       data-title="MV 視覺動態"
       data-desc="音樂錄影帶中的動態視覺段落，結合手繪與 3D 元素。"
       data-images="./images/hero-1.jpg,./images/hero-3.jpg">
    <video autoplay muted loop playsinline preload="metadata" poster="./images/hero-1.jpg"></video>
  </div>

  <div class="shot" data-hover
       data-title="展場循環動畫"
       data-desc="實體展場大螢幕的循環播放動畫，沉浸式的環境視覺。"
       data-images="./images/hero-2.jpg,./images/hero-1.jpg,./images/hero-3.jpg">
    <video autoplay muted loop playsinline preload="metadata" poster="./images/hero-2.jpg"></video>
  </div>

</section>
