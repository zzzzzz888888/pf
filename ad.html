<!-- PAGE HEAD -->
<header class="page-head">
  <span class="eyebrow">Advertising</span>
  <h1>廣告設計</h1>
  <p>商業廣告與行銷視覺。每個專案可能包含多組畫面，點開後可用下方縮圖切換瀏覽。</p>
</header>

<!-- GALLERY (masonry) — each card = a project (may have multiple images) -->
<section class="gallery ad-gallery" id="adGallery">

  <div class="shot" data-hover
       data-title="夏季飲品上市"
       data-year="2025" data-client="某飲料品牌"
       data-desc="夏季新品上市的整合行銷視覺，包含主視覺、社群貼文與店頭物料，統一以清涼的色調貫穿。"
       data-images="./images/hero-3.jpg,./images/hero-1.jpg,./images/hero-2.jpg">
    <img src="./images/hero-3.jpg" alt="夏季飲品上市">
  </div>

  <div class="shot" data-hover
       data-title="新年品牌賀圖"
       data-year="2026" data-client="某零售集團"
       data-desc="農曆新年的品牌賀圖系列，延伸出多款尺寸與版位的廣告素材。"
       data-images="./images/hero-1.jpg,./images/hero-2.jpg">
    <img src="./images/hero-1.jpg" alt="新年品牌賀圖">
  </div>

  <div class="shot" data-hover
       data-title="星空音樂節主視覺"
       data-year="2025" data-client="某音樂活動"
       data-desc="音樂節的主視覺與周邊應用，以星空為核心意象展開一系列宣傳物。"
       data-images="./images/hero-2.jpg,./images/hero-3.jpg,./images/hero-1.jpg">
    <img src="./images/hero-2.jpg" alt="星空音樂節主視覺">
  </div>

  <div class="shot" data-hover
       data-title="單張形象廣告"
       data-year="2024" data-client="某品牌"
       data-desc="單一主視覺的形象廣告（此專案只有一張圖，所以不會出現縮圖列）。"
       data-images="./images/hero-3.jpg">
    <img src="./images/hero-3.jpg" alt="單張形象廣告">
  </div>

  <div class="shot" data-hover
       data-title="節慶促銷系列"
       data-year="2024" data-client="某電商"
       data-desc="節慶檔期的促銷視覺，橫跨多個社群與廣告版位的系列素材。"
       data-images="./images/hero-1.jpg,./images/hero-3.jpg,./images/hero-2.jpg">
    <img src="./images/hero-1.jpg" alt="節慶促銷系列">
  </div>

  <div class="shot" data-hover
       data-title="品牌形象更新"
       data-year="2023" data-client="某新創"
       data-desc="品牌形象更新後的廣告應用，包含數位與實體兩種版位。"
       data-images="./images/hero-2.jpg,./images/hero-1.jpg">
    <img src="./images/hero-2.jpg" alt="品牌形象更新">
  </div>

</section>
